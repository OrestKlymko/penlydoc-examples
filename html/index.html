<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign your contract</title>
</head>
<body>
<h1>Sign your contract</h1>
<p id="status"></p>
<div id="sign"></div>

<!-- embed.js must come from PenlyDoc -->
<script src="https://penlydoc.com/embed.js"></script>
<script type="module">
  // your backend: POST /v1/envelopes/{id}/recipients/{rid}/signing-url, after checking the logged-in user
  const res = await fetch('/api/contracts/lease-2291/sign-link', { method: 'POST' });
  const { url } = await res.json();

  Penly.mount('#sign', {
    url,
    height: '80vh',
    hideHeader: true,
    onCompleted: e => document.getElementById('status').textContent =
      e.envelopeStatus === 'COMPLETED' ? 'Everyone has signed.' : 'Thank you, we are waiting for the other side.',
    onDeclined: () => document.getElementById('status').textContent = 'You declined. We will get in touch.',
    onError: e => console.warn('signing error', e.code)
  });
</script>
</body>
</html>
